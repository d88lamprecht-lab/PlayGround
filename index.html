<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;
const W=480,H=270,FLOOR=224,keys=Object.create(null),touch=Object.create(null);
let state='title',last=0,elapsed=0,round=1,roundWins=[0,0],timer=60,shake=0,flash=0,particles=[],projectiles=[],audioOn=false,audioCtx=null,announcer='';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

 'Zangief':makeLook('#d39a78','#5b382b','#963a37','#e8b05f','#77332e','#d89a55','mohawk','none','belt'),

 'M. Bison':makeLook('#d6a183','#33242a','#a6333e','#d0b9dc','#49304e','#c59bd9','cap','none','armor'),
 'Cammy':makeLook('#efc1a0','#d3c28f','#497d4a','#d7eee0','#315b3b','#e26674','beret','none','sash'),
 'T. Hawk':makeLook('#b8805d','#21191a','#8a603e','#e8c68b','#65482f','#e6b866','headband','none','feathers'),
 'Fei Long':makeLook('#e8b58f','#171718','#ece6d8','#df453e','#30252a','#f0c65c','band','none','sash'),
 'Dee Jay':makeLook('#8e5e43','#17191a','#e0a72f','#f4df77','#34645c','#61c9a6','short','none','music'),

};
const mkRoster=['Scorpion','Sub-Zero','Liu Kang','Raiden','Johnny Cage','Sonya Blade','Kitana','Jax','Kano','Mileena','Kung Lao','Shang Tsung','Noob Saibot','Cassie Cage','Reptile'];
const sfRoster=['Ryu','Ken','Chun-Li','Guile','Blanka','Vega','Dhalsim','Zangief','Balrog','M. Bison','Cammy','T. Hawk','Fei Long','Dee Jay','Akuma'];
function shuffled(list){const result=[...list];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
const featuredRoster=shuffled([...shuffled(mkRoster).slice(0,7),...shuffled(sfRoster).slice(0,8)]);
const charSelect={player:0,cpu:1};
function fighter(id,name=''){return {id,name,x:id===0?122:358,y:FLOOR,vx:0,vy:0,face:id===0?1:-1,hp:100,stun:0,attack:0,attackType:'',attackHit:false,cool:0,block:false,jumps:0,walk:0,pose:0,energy:0,combo:0,comboTimer:0,flash:0}}
let p1=fighter(0,featuredRoster[charSelect.player]),p2=fighter(1,featuredRoster[charSelect.cpu]);
function selectNextPlayer(step){charSelect.player=(charSelect.player+step+featuredRoster.length)%featuredRoster.length;while(charSelect.player===charSelect.cpu)charSelect.cpu=(charSelect.cpu+step+featuredRoster.length)%featuredRoster.length;p1.name=featuredRoster[charSelect.player];p2.name=featuredRoster[charSelect.cpu]}
function selectNextCpu(step){charSelect.cpu=(charSelect.cpu+step+featuredRoster.length)%featuredRoster.length;while(charSelect.player===charSelect.cpu)charSelect.player=(charSelect.player-step+featuredRoster.length)%featuredRoster.length;p1.name=featuredRoster[charSelect.player];p2.name=featuredRoster[charSelect.cpu]}
function resetRound(){p1=fighter(0,featuredRoster[charSelect.player]);p2=fighter(1,featuredRoster[charSelect.cpu]);p1.x=122;p2.x=358;timer=60;particles=[];projectiles=[]}
function startGame(){round=1;roundWins=[0,0];resetRound();state='fight';announcer='ROUND 1';elapsed=0}
function keydown(e){let k=e.key.toLowerCase();if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k))e.preventDefault();keys[k]=true;if(state==='title'&&k==='q'){selectNextPlayer(-1);return}if(state==='title'&&k==='e'){selectNextPlayer(1);return}if(state==='title'&&k==='a'){selectNextCpu(-1);return}if(state==='title'&&k==='d'){selectNextCpu(1);return}if((state==='title'||state==='over')&&(k==='enter'||k===' '))startGame();if(state==='roundend'&&k==='enter')nextRound();if(k==='escape')state=state==='paused'?'fight':'paused'}
function keyup(e){keys[e.key.toLowerCase()]=false}
window.addEventListener('keydown',keydown);window.addEventListener('keyup',keyup);window.addEventListener('blur',()=>{if(state==='fight')state='paused'});
document.querySelector('.stage').addEventListener('pointerdown',e=>{if(state!=='title')return;const bounds=canvas.getBoundingClientRect(),x=(e.clientX-bounds.left)/bounds.width*W;if(x<160)selectNextPlayer(-1);else if(x>320)selectNextCpu(1);else startGame()});
document.querySelectorAll('.touch-btn').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();touch[k]=true;b.classList.add('down')},off=e=>{e.preventDefault();touch[k]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
document.querySelector('#sound').onclick=()=>{audioOn=!audioOn;document.querySelector('#sound').innerHTML=audioOn?'♪&nbsp; Sound on':'♪&nbsp; Sound off';if(audioOn&&!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)()};
function down(...ks){return ks.some(k=>keys[k]||touch[k])}
function sound(freq=180,duration=.08,type='square',vol=.035){if(!audioOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}
function puff(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:-Math.random()*3,life:18+Math.random()*14,color,size:2+Math.random()*3})}
const moves={weakPunch:{duration:13,cool:17,damage:5,reach:35,activeAt:7,energy:3},mediumPunch:{duration:17,cool:23,damage:8,reach:41,activeAt:9,energy:5},strongPunch:{duration:25,cool:35,damage:13,reach:48,activeAt:13,energy:8},weakKick:{duration:16,cool:21,damage:7,reach:44,activeAt:8,energy:4},mediumKick:{duration:21,cool:29,damage:11,reach:51,activeAt:11,energy:6},strongKick:{duration:29,cool:42,damage:16,reach:59,activeAt:15,energy:9},grapple:{duration:25,cool:38,damage:14,reach:37,activeAt:14,energy:10},finisher:{duration:44,cool:70,damage:100,reach:92,activeAt:23,energy:0}};
function attack(f,type){const move=moves[type];if(!move||f.cool>0||f.stun>0||f.attack>0)return;if(type==='finisher'&&(f.energy<100|| (f.id===0?p2.hp:p1.hp)>25))return;f.attack=move.duration;f.attackType=type;f.attackHit=false;f.cool=move.cool;f.energy=type==='finisher'?0:Math.min(100,f.energy+move.energy);sound(type==='finisher'?90:type==='grapple'?105:150,.08,type==='finisher'?'sawtooth':'square')}
function projectile(f){if(f.energy<35||f.cool>0)return;projectiles.push({x:f.x+f.face*18,y:f.y-39,vx:f.face*3.3,life:100,owner:f.id,color:palettes[f.id].accent});f.energy-=35;f.cool=24;puff(f.x+f.face*20,f.y-39,palettes[f.id].accent,5);sound(340,.14,'sawtooth')}
function hit(attacker,defender,type){const grab=type==='grapple'||type==='finisher',blocked=!grab&&defender.block;const move=moves[type],base=type==='special'?16:move?move.damage:8,dmg=type==='finisher'?defender.hp:blocked?Math.max(2,Math.ceil(base*.38)):base;defender.hp=Math.max(0,defender.hp-dmg);defender.stun=blocked?7:type==='finisher'?48:type==='grapple'?27:type.includes('Kick')?18:12;defender.vx=(blocked?.7:type==='finisher'?4:type==='grapple'?3:2.2)*attacker.face;defender.vy=blocked?-1:type==='finisher'?-4:type==='grapple'?-3:type.includes('Kick')?-2.4:-1.3;defender.flash=type==='finisher'?14:5;attacker.combo++;attacker.comboTimer=85;shake=type==='finisher'?11:blocked?2:5;flash=type==='finisher'?12:blocked?2:4;puff(defender.x,defender.y-30,type==='finisher'?'#ff5775':blocked?'#aaf4ff':'#ffdc84',type==='finisher'?24:blocked?4:9);sound(type==='finisher'?55:blocked?100:75,.12,'square',.05);if(type==='finisher')announcer='RIFT FINISH!';else if(!blocked&&attacker.combo>=2)announcer=attacker.combo+' HIT COMBO!'}

function updateFighter(f,op,dt){f.face=op.x>f.x?1:-1;f.cool=Math.max(0,f.cool-dt);f.stun=Math.max(0,f.stun-dt);f.flash=Math.max(0,f.flash-dt);f.comboTimer=Math.max(0,f.comboTimer-dt);if(!f.comboTimer)f.combo=0;
if(f.stun<=0){let left=f.id===0?down('a','arrowleft','left'):false,right=f.id===0?down('d','arrowright','right'):false,jump=f.id===0?down('w','arrowup','jump'):false;const distance=Math.abs(op.x-f.x);
if(f.id===1){left=distance>54&&f.x>op.x;right=distance>54&&f.x<op.x;jump=distance>95&&Math.random()<.002;if(distance<65&&f.cool===0&&f.attack===0&&Math.random()<.035)attack(f,Math.random()<.62?'mediumPunch':'mediumKick');if(distance>120&&f.energy>=35&&f.cool===0&&Math.random()<.008)projectile(f)}
f.block=f.id===0?down('s','arrowdown','block'):distance<85&&Math.random()<.015;let move=(right?1:0)-(left?1:0);if(f.block)move=0;f.vx+=(move*1.35-f.vx)*.28;if(move)f.walk+=dt*(f.block?1:1.6);if(jump&&f.jumps<2&&f.vy===0){f.vy=-6.1;f.jumps++;sound(220,.05)}
if(f.id===0){if(down('j','weakPunch'))attack(f,'weakPunch');if(down('u','mediumPunch'))attack(f,'mediumPunch');if(down('i','strongPunch'))attack(f,'strongPunch');if(down('k','weakKick'))attack(f,'weakKick');if(down('o','mediumKick'))attack(f,'mediumKick');if(down('p','strongKick'))attack(f,'strongKick');if(down('g','grapple'))attack(f,'grapple');if(down('f','finisher'))attack(f,'finisher');if(down('l','special')&&f.energy>=35&&f.cool===0)projectile(f)}}else{f.block=false;f.vx*=.93}
if(f.attack>0){f.attack=Math.max(0,f.attack-dt);const move=moves[f.attackType];if(move&&f.attack<=move.activeAt&&!f.attackHit){if(Math.abs(op.x-f.x)<move.reach&&Math.abs(op.y-f.y)<40){hit(f,op,f.attackType);f.attackHit=true}}}
f.vy+=.27*dt;f.y+=f.vy*dt;f.x+=f.vx*dt;if(f.y>=FLOOR){f.y=FLOOR;f.vy=0;f.jumps=0}f.x=clamp(f.x,42,438);if(f.attack===0)f.attackHit=false}
function update(dt){elapsed+=dt;if(state==='fight'){timer=Math.max(0,timer-dt/60);updateFighter(p1,p2,dt);updateFighter(p2,p1,dt);
for(let i=projectiles.length-1;i>=0;i--){let b=projectiles[i];b.x+=b.vx*dt;b.life-=dt;if(Math.abs(b.x-(b.owner===0?p2.x:p1.x))<15&&Math.abs(b.y-(b.owner===0?p2.y:p1.y)-38)<25){let target=b.owner===0?p2:p1,owner=b.owner===0?p1:p2;hit(owner,target,'special');projectiles.splice(i,1)}else if(b.life<=0||b.x<0||b.x>480)projectiles.splice(i,1)}
if(timer<=0||p1.hp<=0||p2.hp<=0){let winner=p1.hp===p2.hp?null:p1.hp>p2.hp?0:1;if(winner!==null)roundWins[winner]++;state='roundend';announcer=winner===null?'TIME UP — DRAW':winner===0?'PLAYER 1 WINS ROUND':'CPU WINS ROUND';sound(winner===null?180:330,.3,'triangle');setTimeout(()=>{if(state==='roundend'){if(roundWins[0]>=2||roundWins[1]>=2)state='over';else nextRound()}},2200)}}
particles=particles.filter(q=>q.life>0);particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.1*dt;q.life-=dt});shake=Math.max(0,shake-.35*dt);flash=Math.max(0,flash-.35*dt)}
function nextRound(){round++;resetRound();state='fight';announcer='ROUND '+round;elapsed=0}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(s,x,y,size,color='#fff',align='center',font="'Press Start 2P'"){ctx.fillStyle=color;ctx.textAlign=align;ctx.font=`${size}px ${font}, monospace`;ctx.fillText(s,x,y)}
function background(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b1730');g.addColorStop(.58,'#36233b');g.addColorStop(1,'#11101f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffb66d';ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(362,75,28,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;rect(0,129,480,3,'#f29a7540');
